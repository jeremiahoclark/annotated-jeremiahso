name = "annotated-app"
main = "src/index.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]
account_id = "04b10da5b2c496a790ebb3f60bfe1b18"

# SPA assets from frontend build. Run `npm run build -w annotated-web` first.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

# Production: routes /api/* to annotated-api by service name.
# Local: start annotated-api separately; Wrangler resolves the binding.
[[services]]
binding = "API"
service = "annotated-api"
